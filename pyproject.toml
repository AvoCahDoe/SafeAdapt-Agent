[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safeadapt"
version = "0.1.0"
description = "Research framework for studying alignment drift in continually interacting LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SafeAdapt Research" }]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "httpx>=0.24",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
]

[project.scripts]
safeadapt = "safeadapt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/safeadapt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
